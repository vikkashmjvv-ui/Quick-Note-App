{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
    <h1 class="page-title">Your Notes!</h1>
    <h2 class="welcome-msg">Welcome, {{ user.name }}!</h2>

    <div class="notes-list">
        {% for note in notes %}
            <div class="note-row" id="note-{{ note.id }}">
                <form method="POST" action="{{ url_for('edit_note', note_id=note.id) }}" class="note-edit-form">
                    <input
                        type="text"
                        name="title"
                        class="note-title-input"
                        value="{{ note.title }}"
                        readonly
                        id="input-{{ note.id }}"
                    >
                    <span class="note-date">{{ note.created_at }}</span>
                    <div class="note-actions">
                        <button type="button" class="btn-edit" onclick="toggleEdit({{ note.id }})" id="edit-btn-{{ note.id }}">Edit</button>
                        <button type="submit" class="btn-save" id="save-btn-{{ note.id }}" style="display:none;">Save</button>
                    </div>
                </form>
                <form method="POST" action="{{ url_for('delete_note', note_id=note.id) }}">
                    <button type="submit" class="btn-delete" onclick="return confirm('Delete this note?')">Delete</button>
                </form>
            </div>
        {% else %}
            <p class="no-notes">No notes yet. Add your first note below!</p>
        {% endfor %}
    </div>

    <form method="POST" action="{{ url_for('add_note') }}" class="add-note-form">
        <textarea name="title" placeholder="Type your note here..." required></textarea>
        <button type="submit" class="btn-primary">Add Note</button>
    </form>

    <script>
        function toggleEdit(noteId) {
            const input = document.getElementById('input-' + noteId);
            const editBtn = document.getElementById('edit-btn-' + noteId);
            const saveBtn = document.getElementById('save-btn-' + noteId);

            input.readOnly = false;
            input.focus();
            editBtn.style.display = 'none';
            saveBtn.style.display = 'inline-block';
        }
    </script>
{% endblock %}
